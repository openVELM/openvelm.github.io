name: Mirror models to GitHub Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face client
        run: python -m pip install 'huggingface_hub>=0.30,<2'

      - name: Download and package Q4 models
        run: python scripts/mirror_models.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Create or update the model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view models-v1 >/dev/null 2>&1; then
            gh release create models-v1 \
              --title 'VELM local models v1' \
              --notes 'Q4 ONNX SmolLM2 models mirrored from the official HuggingFaceTB repositories. See models-manifest.json for upstream revisions, file sizes, and SHA-256 hashes. Upstream model licenses apply.'
          fi
          for asset in release-assets/*; do
            gh release upload models-v1 "$asset" --clobber
          done
